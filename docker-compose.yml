name: rollrank

services:
  rollrank:
    build:
      context: .
      dockerfile: Dockerfile
    image: rollrank:latest
    container_name: rollrank
    ports:
      - "7272:7272"
    user: "${ROLLRANK_UID:-1000}:${ROLLRANK_GID:-1000}"
    environment:
      APP_DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
